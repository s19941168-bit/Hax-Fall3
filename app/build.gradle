plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hexfall.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.hexfall.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // подписываем стандартным debug-ключом, чтобы release-APK сразу ставился на телефон
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
